# A table theme of OpenL Studio: the look it gives every table it styles, one part for each kind of table below.
# The format and every attribute: OpenL Studio User Guide > Table Themes.

name: Green

# The colours of the theme, each named once: a part names the colour it takes, so a colour changes in one place.
colors:
  black: "#000000"
  white: "#ffffff"
  darkGreen: "#548235"
  green: "#c6e0b4"
  lightGreen: "#e2efda"
  paleGreen: "#ebf1de"
  # The greys of the technical tables.
  paleGrey: "#f2f2f2"
  lightGrey: "#e7e6e6"
  silver: "#d9d9d9"

base:
  # The look every cell of the table starts from. It names every attribute, so the theme overrides the look the
  # workbook gives the table: no fill, line, font or alignment of the workbook shows through.
  style:
    fontFamily: Franklin Gothic Book
    fontSize: 10
    bold: false
    italic: false
    underline: false
    strikeout: false
    color: black
    background: white
    align: left
    valign: top
    border:
      top: none
      right: none
      bottom: none
      left: none
  header:
    style:
      align: center
      border:
        top: &line {style: thin, color: darkGreen}
        bottom: *line
    keyword: &muted
      color: darkGreen
    name:
      bold: true
    type: *muted
    parameters: *muted
  properties:
    border:
      bottom: *line
  lastRow:
    border:
      bottom: *line

datatype:
  # A Datatype fills its header, and so does a Vocabulary.
  header: &filled
    style:
      background: green
  name: &fieldName
    background: lightGreen

vocabulary:
  header: *filled
  values:
    align: center

spreadsheet: &spreadsheet
  titles:
    bold: true
    align: center
    background: lightGreen
  sections:
    bold: true
    italic: true
    align: center
    background: lightGreen
    border:
      top: *line
  marked:
    bold: true
  result:
    bold: true

data: &data
  header:
    style:
      align: left
  name: *muted
  titles:
    bold: true
    align: center
    background: lightGreen
  values:
    align: center
  ids:
    bold: true
    background: green
  empty:
    background: paleGrey

test: *data
run: *data

rules: &rules
  code: &code
    <<: *muted
    border:
      bottom: *line
  titles:
    bold: true
    align: center
    background: lightGreen
    border:
      right: *line
  values:
    align: center
    border:
      right: *line
  horizontals:
    bold: true
    align: center
    background: green
    border:
      bottom: *line
  returnTitles:
    bold: true
    align: center
    background: green
  returns: &returned
    align: center
    background: paleGreen
  groups:
    border:
      top: *line

simpleRules: *rules
smartRules: *rules
simpleLookup: *rules
smartLookup: *rules

# The tables that declare what a decision table takes by its titles look like the code and the titles of a Rules table.
conditions: *rules
actions: *rules
returns: *rules

# A TBasic table looks like a Spreadsheet, the row naming its columns like the code of a Rules table.
tbasic:
  <<: *spreadsheet
  code: *code

# A ColumnMatch table looks like a Rules table, with a line after the names it checks and between its values.
columnMatch:
  <<: *rules
  name:
    border:
      right: *line
  returns:
    <<: *returned
    border:
      right: *line

# The technical tables are drawn in greys, as in every theme.
environment: &technical
  header:
    style:
      background: lightGrey
  style:
    border:
      bottom: &light
        style: thin
        color: silver
  name:
    background: paleGrey
    border:
      right: *light

properties: *technical

constants:
  type: *muted
  name: *fieldName
