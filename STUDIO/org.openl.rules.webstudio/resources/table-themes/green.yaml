# A table theme of OpenL Studio: the look it gives every table it styles, one part for each kind of table below.
# The format and every attribute: OpenL Studio User Guide > Table Themes.
#
# The Standard theme in greens, its lines green as well. It also fills the header of a Datatype and a Vocabulary, the
# IDs, and the values that are not filled. As in the Standard theme, the base is the General format of the standard,
# and only the kinds the standard gives a look of their own write it below; every other kind takes the base alone.

name: Green

# The theme colours of Excel the colours below are made of, those of the Standard theme. A workbook of these theme
# colours is written each colour as its theme colour; any other workbook as #rrggbb, its theme left as it is.
themeColors:
  name: Office 2013 - 2022
  background1: "#ffffff"
  text1: "#000000"
  background2: "#e7e6e6"
  text2: "#44546a"
  accent1: "#4472c4"
  accent2: "#ed7d31"
  accent3: "#a5a5a5"
  accent4: "#ffc000"
  accent5: "#5b9bd5"
  accent6: "#70ad47"
  hyperlink: "#0563c1"
  followedHyperlink: "#954f72"

# The colours of the theme, each named once: a part names the colour it takes, so a colour changes in one place. The
# greens are made of the sixth accent, but for the palest, the fill of the values, which is a colour of its own.
colors:
  black: Black, Text 1
  white: White, Background 1
  darkGreen: Green, Accent 6, Darker 25%
  green: Green, Accent 6, Lighter 60%
  lightGreen: Green, Accent 6, Lighter 80%
  paleGreen: "#ebf1de"
  # The values of a Data and a Test table that are not filled.
  paleGrey: White, Background 1, Darker 5%

# The General format of the standard, which every kind of table takes.
base:
  # The look every cell of the table starts from. It names every attribute, so the theme overrides the look the
  # workbook gives the table: no fill, line, font or alignment of the workbook shows through.
  style:
    fontFamily: Franklin Gothic Book
    fontSize: 10
    bold: false
    italic: false
    underline: false
    strikeout: false
    color: black
    background: white
    align: left
    valign: center
    border:
      top: none
      right: none
      bottom: none
      left: none
  header:
    style:
      align: center
      border:
        top: &line {style: thin, color: darkGreen}
        bottom: *line
    keyword: &muted
      color: darkGreen
    name:
      bold: true
    type: *muted
    parameters: *muted
  properties:
    <<: *muted
    border:
      bottom: *line
  lastRow:
    border:
      bottom: *line

# The kinds the standard gives a look of their own. A part several of them share is written once, under the first kind
# that takes it, and repeated by an alias.

datatype:
  # A Datatype fills its header, and so does a Vocabulary.
  header: &filled
    style:
      background: green
  titles: &title
    bold: true
    align: center
    background: lightGreen
  type: *muted
  name:
    background: lightGreen
  values: *muted

vocabulary:
  header: *filled
  values:
    align: center

spreadsheet:
  titles: &givenTitle
    <<: *title
    background: green
  stepTitle:
    background: lightGreen
  values:
    background: paleGreen
  sections:
    bold: true
    italic: true
    align: center
    background: lightGreen
    border:
      top: *line
  marked:
    bold: true
  result:
    bold: true
  resultRow:
    border:
      top: *line
      bottom: *line

data:
  name: &fields
    <<: *muted
    align: center
    border:
      bottom: *line
  titles: *givenTitle
  values: &given
    align: center
    background: paleGreen
  ids: &ids
    bold: true
    background: green
  empty: &empty
    background: paleGrey

test:
  name: *fields
  titles: *title
  values:
    align: center
  ids: *ids
  empty: *empty
  returnTitles: *givenTitle
  returns: *given

rules:
  code:
    <<: *muted
    align: center
    border:
      bottom: *line
  titles: *title
  returnTitles: *givenTitle
  returns:
    <<: *given
    align: left
  groups: &groups
    border:
      top: *line

simpleRules: &simple
  titles: *title
  values: &ruled
    align: center
    border:
      top: &fine {style: hair, color: darkGreen}
  returnTitles: *givenTitle
  returns:
    <<: *given
    border:
      top: *fine
  groups: *groups

smartRules: *simple

simpleLookup: &lookup
  titles:
    <<: *title
    border:
      right: *line
  values:
    <<: *ruled
    border:
      top: *fine
      right: *line
  horizontals:
    <<: *givenTitle
    border:
      top: *line
      left: *fine
  returnTitles: *givenTitle
  returns:
    <<: *given
    border:
      top: *fine
      left: *fine
  groups: *groups

smartLookup: *lookup
