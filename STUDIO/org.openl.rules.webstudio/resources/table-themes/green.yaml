# A table theme of OpenL Studio: the look it gives Datatype, Vocabulary, Spreadsheet, Data, Test and Run tables.
# The format and every attribute: OpenL Studio User Guide > Table Themes.

name: Green

base:
  # The look every cell of the table starts from. It names every attribute, so the theme overrides the look the
  # workbook gives the table: no fill, line, font or alignment of the workbook shows through.
  style:
    fontFamily: Franklin Gothic Book
    fontSize: 10
    bold: false
    italic: false
    underline: false
    strikeout: false
    color: "#000000"
    background: "#ffffff"
    align: left
    valign: top
    border:
      top: none
      right: none
      bottom: none
      left: none
  header:
    style:
      align: center
      border:
        top: &line {style: thin, color: "#548235"}
        bottom: *line
    keyword: &muted
      color: "#548235"
    name:
      bold: true
    type: *muted
    parameters: *muted
  properties:
    border:
      bottom: *line
  lastRow:
    border:
      bottom: *line

datatype:
  # A Datatype fills its header, and so does a Vocabulary.
  header: &filled
    style:
      background: "#c6e0b4"
  name:
    background: "#e2efda"

vocabulary:
  header: *filled
  values:
    align: center

spreadsheet:
  titles:
    bold: true
    align: center
    background: "#e2efda"
  sections:
    bold: true
    italic: true
    align: center
    background: "#e2efda"
    border:
      top: *line
  marked:
    bold: true
  result:
    bold: true

data: &data
  header:
    style:
      align: left
  name: *muted
  titles:
    bold: true
    align: center
    background: "#e2efda"
  values:
    align: center
  ids:
    bold: true
    background: "#c6e0b4"
  empty:
    background: "#f2f2f2"

test: *data
run: *data
