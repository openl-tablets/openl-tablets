# A table theme of OpenL Studio: the look it gives every table it styles, one part for each kind of table below.
# The format and every attribute: OpenL Studio User Guide > Table Themes.
#
# The Standard theme in greens, its lines green as well. It also fills the header of a Datatype and a Vocabulary, the
# IDs, and the values that are not filled.

name: Green

# The colours of the theme, each named once: a part names the colour it takes, so a colour changes in one place.
colors:
  black: "#000000"
  white: "#ffffff"
  darkGreen: "#548235"
  green: "#c6e0b4"
  lightGreen: "#e2efda"
  paleGreen: "#ebf1de"
  # The greys of the technical tables.
  paleGrey: "#f2f2f2"
  lightGrey: "#e7e6e6"
  silver: "#d9d9d9"

base:
  # The look every cell of the table starts from. It names every attribute, so the theme overrides the look the
  # workbook gives the table: no fill, line, font or alignment of the workbook shows through.
  style:
    fontFamily: Franklin Gothic Book
    fontSize: 10
    bold: false
    italic: false
    underline: false
    strikeout: false
    color: black
    background: white
    align: left
    valign: center
    border:
      top: none
      right: none
      bottom: none
      left: none
  header:
    style:
      align: center
      border:
        top: &line {style: thin, color: darkGreen}
        bottom: *line
    keyword: &muted
      color: darkGreen
    name:
      bold: true
    type: *muted
    parameters: *muted
  properties:
    <<: *muted
    border:
      bottom: *line
  lastRow:
    border:
      bottom: *line

  # The parts the kinds of tables share, each written once.
  titles: &title
    bold: true
    align: center
    background: lightGreen
  returnTitles:
    <<: *title
    background: green
  returns:
    align: center
    background: paleGreen
  type: *muted
  code:
    <<: *muted
    align: center
    border:
      bottom: *line
  ids:
    bold: true
    background: green
  empty:
    background: paleGrey
  groups:
    border:
      top: *line

datatype:
  # A Datatype fills its header, and so does a Vocabulary.
  header: &filled
    style:
      background: green
  name: &fieldName
    background: lightGreen
  values: *muted

vocabulary:
  header: *filled
  values:
    align: center

spreadsheet: &spreadsheet
  titles:
    background: green
  stepTitle:
    background: lightGreen
  values:
    background: paleGreen
  sections:
    bold: true
    italic: true
    align: center
    background: lightGreen
    border:
      top: *line
  marked:
    bold: true
  result:
    bold: true
  resultRow:
    border:
      top: *line
      bottom: *line

tbasic: *spreadsheet

data:
  name: &fields
    <<: *muted
    align: center
    border:
      bottom: *line
  titles:
    background: green
  values:
    align: center
    background: paleGreen

test: &calls
  name: *fields
  values:
    align: center

run: *calls

rules: &rules
  returns:
    align: left

simpleRules: &simple
  values: &ruled
    align: center
    border:
      top: &fine {style: hair, color: darkGreen}
  returns:
    border:
      top: *fine

smartRules: *simple

simpleLookup: &lookup
  titles:
    border:
      right: *line
  values:
    <<: *ruled
    border:
      top: *fine
      right: *line
  horizontals:
    <<: *title
    background: green
    border:
      top: *line
      left: *fine
  returns:
    border:
      top: *fine
      left: *fine

smartLookup: *lookup

# The tables that declare what a decision table takes by its titles look like the code and the titles of a Rules table.
conditions: *rules
actions: *rules
returns: *rules

# A ColumnMatch table: a line after the names it checks, and between the columns of its values.
columnMatch:
  name:
    border:
      right: *line
  values:
    align: center
    border:
      right: *line
  returns:
    border:
      right: *line

# The technical tables are drawn in greys, as in every theme.
environment: &technical
  header:
    style:
      background: lightGrey
  style:
    border:
      bottom: &light
        style: thin
        color: silver
  name:
    background: paleGrey
    border:
      right: *light

properties: *technical

constants:
  name: *fieldName
