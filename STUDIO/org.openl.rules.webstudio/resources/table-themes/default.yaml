# A table theme of OpenL Studio: the look it gives every table it styles, one part for each kind of table below.
# The format and every attribute: OpenL Studio User Guide > Table Themes.
#
# Every attribute is optional: one the theme leaves out keeps what the cell has in the workbook.
# The base is the skin every table shares; a kind of table extends it with what it changes, and takes the rest of the
# base as it is. Every theme styles every kind: a kind the theme writes nothing for (datatype, vocabulary,
# spreadsheet, data, test, run, rules, simpleRules, smartRules, simpleLookup, smartLookup, environment, properties,
# constants) takes the base alone.

name: Default

base:
  # The look every cell of the table starts from. It names every attribute, so the theme overrides the look the
  # workbook gives the table: no fill, line, font or alignment of the workbook shows through.
  style:
    fontFamily: Franklin Gothic Book
    fontSize: 10
    bold: false
    italic: false
    underline: false
    strikeout: false
    color: "#000000"
    background: "#ffffff"
    align: left
    valign: top
    border:
      top: none
      right: none
      bottom: none
      left: none
  # The signature of the table, unfilled. Its text is formatted in pieces; the text itself is never changed.
  header:
    style:
      align: center
      border:
        top: thin
        bottom: thin
    keyword: &muted
      color: "#808080"
    name:
      bold: true
      color: "#000000"
    # The type the header names besides the table: "<String>" of a Vocabulary, "extends Parent" of a Datatype, or
    # the type a Spreadsheet or a decision table returns.
    type: *muted
    # The parameters of a Spreadsheet or a decision table, "( Policy policy )".
    parameters: *muted
  # The rows of table properties under the header, closed by a line.
  properties:
    border:
      bottom: thin
  lastRow:
    border:
      bottom: thin

datatype:
  # A Datatype fills its header, and so does a Vocabulary.
  header: &filled
    style:
      background: "#b4c6e7"
  titles:
    bold: true
  name: &fieldName
    background: "#ddebf7"
  values:
    align: center

vocabulary:
  header: *filled
  values:
    align: center

spreadsheet:
  # The row naming the columns, such as "Formula".
  titles:
    bold: true
    align: center
    background: "#b4c6e7"
    border:
      top: thin
  # The title of the column of steps, such as "Step", laid over the titles.
  stepTitle:
    background: "#d0cece"
  # The formulas and the values of the steps.
  values:
    background: "#ddebf7"
  # A step whose name is merged across its row: a heading that splits the steps into sections.
  sections:
    bold: true
    italic: true
    align: center
    background: "#b4c6e7"
    border:
      top: thin
  # A step or a column marked with "*" for the result of the Spreadsheet.
  marked:
    bold: true
  # The step whose value a Spreadsheet returns, when it returns a type other than SpreadsheetResult: the step
  # named RETURN, or else the last step.
  result:
    bold: true

data: &data
  # The header reaches across every value of the table, so its text starts at the left.
  header:
    style:
      align: left
  # The rows naming the fields and the tables they take their values from, such as "policyNumber".
  name: *muted
  # The row naming the columns, such as "Policy Number".
  titles:
    bold: true
    align: center
    background: "#ddebf7"
  values:
    align: center
  # The IDs of a Data table, and the values a Test or a Run table takes from a Data table by their IDs.
  ids:
    bold: true
    background: "#fff2cc"
  # A value that is not filled.
  empty:
    background: "#f2f2f2"

# A Test and a Run table look like a Data table.
test: *data
run: *data

rules: &rules
  # The rows a Rules table declares its columns in: the kind of each column, such as "C1" or "RET1", its expression
  # and its parameters, closed by a line. A SimpleRules, a SmartRules and a lookup have none.
  code:
    <<: *muted
    border:
      bottom: thin
  # The titles of the conditions, with a line between the columns.
  titles:
    bold: true
    align: center
    background: "#d0cece"
    border:
      right: thin
  # The values the conditions are checked against.
  values:
    align: center
    border:
      right: thin
  # The values of a horizontal condition, across the top of a lookup.
  horizontals:
    bold: true
    align: center
    background: "#b4c6e7"
    border:
      bottom: thin
  # The title of a column the table returns.
  returnTitles:
    bold: true
    align: center
    background: "#b4c6e7"
  # The values the table returns.
  returns:
    align: center
    background: "#ddebf7"
  # The rules that share a value of a condition merged over them make a group: a line over its first rule and over
  # the rule after it sets the group apart.
  groups:
    border:
      top: thin

# A SimpleRules, a SmartRules and a lookup look like a Rules table.
simpleRules: *rules
smartRules: *rules
simpleLookup: *rules
smartLookup: *rules

# An Environment table: the packages a module imports and the modules it depends on. A technical table, drawn in
# greys.
environment: &technical
  header:
    style:
      background: "#e7e6e6"
  # A light line under every setting and every value, so each reads as a row of its own.
  style:
    border:
      bottom: &light
        style: thin
        color: "#d9d9d9"
  # The settings, such as "import" or "dependency", set apart from their values.
  name:
    background: "#f2f2f2"
    border:
      right: *light

# A Properties table, the properties a module or a category of tables shares, is as technical as an Environment.
properties: *technical

# A Constants table: the type, the name and the value of each constant.
constants:
  # The type of a constant, muted beside its name.
  type: *muted
  # The names of the constants, filled as the field names of a Datatype.
  name: *fieldName
