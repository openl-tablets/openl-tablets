<ui:composition
        xmlns:ui="http://java.sun.com/jsf/facelets">

    <script>
        //<![CDATA[

        // Opens the React delete-file modal (mounted by studio-ui in #appRoot).
        // The projectId is the REST id computed by the backend; the path is the
        // file or folder path relative to the project root.
        function openDeleteFileDialog(projectId, path, name, isFolder) {
            globalThis.dispatchEvent(new CustomEvent('openDeleteFileModal', {
                detail: {
                    projectId: projectId,
                    path: path,
                    name: name,
                    isFolder: isFolder,
                    onSuccess: designRepoRefresh
                }
            }));
        }

        //]]>
    </script>
</ui:composition>
