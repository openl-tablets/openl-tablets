<ui:composition
        xmlns:ui="http://java.sun.com/jsf/facelets">

    <!-- The Project page is rendered by the studio-ui React app (ProjectPage). The persistent
         React app portals ProjectPage into this placeholder (see JsfIslandHost / islandRegistry);
         it reads the read-only summary from GET /projects/{id} and the editable descriptor from
         GET /projects/{id}/descriptor. -->
    <div data-island="project-page" data-project-id="#{studio.currentProjectId}"></div>

</ui:composition>
