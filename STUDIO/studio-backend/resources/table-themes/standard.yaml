# A table theme of OpenL Studio: the look it gives every table it styles, one part for each kind of table below.
# The format and every attribute: OpenL Studio User Guide > Table Themes.
#
# Every attribute is optional: one the theme leaves out keeps what the cell has in the workbook.
# The base is the skin every table shares; a kind of table extends it with what it changes, and takes the rest of the
# base as it is. Every theme styles every kind: a kind the theme writes nothing for takes the base alone.
#
# The theme follows the formatting standard of OpenL tables. The base is its General section, which the standard
# applies to every table, and the colours are the ones it names. The kinds the standard gives a look of their own
# write it below: a Datatype and a Vocabulary, a Spreadsheet, a Data and a Test table, and the decision tables, the
# rules and the lookups. Every other kind (tbasic, method, run, columnMatch, conditions, actions, returns,
# environment, properties, constants) takes the base alone: the General format.

name: Standard

# The primary theme: listed before the others, so it is the one selected first when a theme is applied to a table or
# to a project.
primary: true

# The theme colours of Excel the colours below are made of: Office 2013 - 2022, whose colours the standard names.
# A workbook of these theme colours is written each colour as its theme colour, so Excel offers it in its palette;
# any other workbook as #rrggbb, its theme left as it is.
themeColors:
  name: Office 2013 - 2022
  background1: "#ffffff"
  text1: "#000000"
  background2: "#e7e6e6"
  text2: "#44546a"
  accent1: "#4472c4"
  accent2: "#ed7d31"
  accent3: "#a5a5a5"
  accent4: "#ffc000"
  accent5: "#5b9bd5"
  accent6: "#70ad47"
  hyperlink: "#0563c1"
  followedHyperlink: "#954f72"

# The colours of the theme, each named once: a part names the colour it takes, so a colour changes in one place. Each
# is a theme colour, written as the standard and the palette of Excel name it.
colors:
  # The text and the fill of every cell: Automatic (Black), which the sample of the standard writes as the first text
  # colour, and the first background colour.
  black: Black, Text 1
  white: White, Background 1
  # What a table declares besides its name and its values, such as its types.
  darkGrey: White, Background 1, Darker 50%
  # The titles of what a table takes, such as its conditions.
  grey: White, Background 1, Darker 25%
  # The titles of what a table gives, such as its formulas and its results.
  blue: Blue, Accent 1, Lighter 60%
  # The values a table gives, and the field names of a Datatype.
  lightBlue: Blue, Accent 5, Lighter 80%

# The General format of the standard, which every kind of table takes.
base:
  # The General Standard: the look every cell of every table starts from, black on white. It names every attribute,
  # so the theme overrides the look the workbook gives the table: no fill, line, font or alignment of the workbook
  # shows through.
  style:
    fontFamily: Franklin Gothic Book
    fontSize: 10
    bold: false
    italic: false
    underline: false
    strikeout: false
    color: black
    background: white
    align: left
    # Centred from top to bottom, which shows in a cell merged over several rows, such as the title of a condition
    # of a lookup beside its horizontal conditions.
    valign: center
    border:
      top: none
      right: none
      bottom: none
      left: none
  # The Table Header Standard: the signature of the table, centred between two lines, unfilled. Its text is formatted
  # in pieces; the text itself is never changed.
  header:
    style:
      align: center
      border:
        top: thin
        bottom: thin
    # Every piece but the name of the table is muted, such as the keyword.
    keyword: &muted
      color: darkGrey
    name:
      bold: true
    # The type the header names besides the table: "<String>" of a Vocabulary, "extends Parent" of a Datatype, or
    # the type a Spreadsheet or a decision table returns.
    type: *muted
    # The parameters of a Spreadsheet or a decision table, "( Policy policy )".
    parameters: *muted
  # The rows of table properties under the header, muted and closed by a line.
  properties:
    <<: *muted
    border:
      bottom: thin
  # The Table Body Standard: a line closes the table.
  lastRow:
    border:
      bottom: thin

# The kinds the standard gives a look of their own. A part several of them share is written once, under the first kind
# that takes it, and repeated by an alias.

# A Datatype: its field names on light blue between muted types and defaults. One that names its columns titles them
# bold and centred on grey, as the other kinds title what a table takes.
datatype:
  titles: &title
    bold: true
    align: center
    background: grey
  type: *muted
  name:
    background: lightBlue
  values: *muted

vocabulary:
  values:
    align: center

spreadsheet:
  # The titles of the columns, such as "Formula", blue as the titles of what a table gives, and the title of the
  # column of steps, such as "Step", grey.
  titles: &givenTitle
    <<: *title
    background: blue
  stepTitle:
    background: grey
  # The formulas and the values of the steps.
  values:
    background: lightBlue
  # A step whose name is merged across its row: a heading that splits the steps into sections.
  sections:
    bold: true
    italic: true
    align: center
    background: blue
    border:
      top: thin
  # A step or a column marked with "*" for the result of the Spreadsheet.
  marked:
    bold: true
  # The step a Spreadsheet returns: the step named RETURN, or else the last step, which closes a Spreadsheet
  # returning SpreadsheetResult. Its name is bold, and lines set its row apart.
  result:
    bold: true
  resultRow:
    border:
      top: thin
      bottom: thin

data:
  # The rows naming the fields and the tables they take their values from, such as "policyNumber", muted, centred
  # and closed by a line.
  name: &fields
    <<: *muted
    align: center
    border:
      bottom: thin
  # The titles, such as "Policy Number", and the values look like what a table gives: centred on light blue.
  titles: *givenTitle
  values: &given
    align: center
    background: lightBlue
  # The keys, bold: the first column of a table, which OpenL takes for its keys unless it is a column "_PK_", which
  # names its keys itself.
  ids: &ids
    bold: true

# A Test table: the inputs are titled as what a table takes, and the results it expects look like what a table gives.
# The keys it takes values from a Data table by are bold.
test:
  name: *fields
  titles: *title
  values:
    align: center
  ids: *ids
  returnTitles: *givenTitle
  returns: *given

# A Rules table: the rows of code it declares its columns in muted, centred and closed by a line, the titles of its
# conditions grey and of what it returns blue. What it returns lines up on the left, as its values do, the expressions
# and the texts they often are.
rules:
  code:
    <<: *muted
    align: center
    border:
      bottom: thin
  titles: *title
  returnTitles: *givenTitle
  returns:
    <<: *given
    align: left
  # The rules that share a value of a condition merged over them make a group: a line sets the group apart.
  groups: &groups
    border:
      top: thin

# A SimpleRules and a SmartRules table: the values the conditions are checked against and the names of the rules
# centred, and a fine line between the rules.
simpleRules: &simple
  titles: *title
  values: &ruled
    align: center
    border:
      top: hair
  returnTitles: *givenTitle
  returns:
    <<: *given
    border:
      top: hair
  groups: *groups

smartRules: *simple

# A lookup: a line after each of its conditions, its horizontal conditions blue with a line between their rows, and
# a fine line between the columns of the values it returns. The columns under a merged value of a horizontal
# condition make a group, as the rules do.
simpleLookup: &lookup
  titles:
    <<: *title
    border:
      right: thin
  values:
    <<: *ruled
    border:
      top: hair
      right: thin
  horizontals:
    <<: *givenTitle
    border:
      top: thin
      left: hair
  returnTitles: *givenTitle
  returns:
    <<: *given
    border:
      top: hair
      left: hair
  groups: *groups

smartLookup: *lookup
