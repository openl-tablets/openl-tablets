# A theme that names its colours once: a font, a fill and a line each take one by its name.

colors:
  ink: Blue, Accent 5, Darker 50%
  paper: Blue, Accent 5, Lighter 80%

base:
  header:
    keyword:
      color: ink
  lastRow:
    border:
      bottom: {style: thin, color: ink}

datatype:
  name:
    # A colour named as the palette of Excel names it stands beside the named ones.
    color: Black, Text 1
    background: paper
