# A theme that makes its colours of the theme colours of Excel, named as the palette of Excel names them.

colors:
  # As the formatting standard names them, the name Excel gives the colour first.
  blue: Blue, Accent 1, Lighter 60%
  muted: White, Background 1, Darker 50%
  # Without the name, and in any letter case.
  ink: text 1
  line: Accent 6, darker 25%

base:
  header:
    keyword:
      color: muted
  lastRow:
    border:
      bottom: {style: thin, color: line}

datatype:
  name:
    color: ink
    background: blue
  # A part may name a theme colour itself.
  values:
    background: Blue, Accent 5, Lighter 80%
