# A theme whose Vocabulary changes one piece of the header of the base and keeps the rest of it.

base:
  header:
    style:
      background: Green, Accent 6, Lighter 60%
    keyword: &muted
      color: Green, Accent 6, Darker 25%
    name:
      bold: true
    type: *muted

# Named with nothing in it: a Datatype takes the base alone.
datatype: {}

vocabulary:
  header:
    name:
      bold: false
