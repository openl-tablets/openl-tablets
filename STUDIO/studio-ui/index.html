<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OpenL Studio</title>
    <meta name="description" content="For creation, editing, testing and deploying of OpenL Tablets rules"/>
    <base href="/"/>
    <link rel="icon" href="favicon.ico?v=studio" sizes="48x48"/>
    <link rel="icon" href="favicon.svg?v=studio" sizes="any" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=studio"/>
    <link rel="manifest" href="icons/site.webmanifest?v=studio"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script>
        // Paints the page in the remembered appearance before the bundle arrives, so a dark reader sees no
        // white flash. The key mirrors THEME_MODE_KEY in src/utils/themeMode.ts; the bundle takes over from here.
        (function () {
            try {
                var mode = localStorage.getItem('openl.theme.mode') || 'auto'
                var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
            } catch (e) {
                // a browser that refuses storage is painted by the bundle alone
            }
        })()
    </script>
    <script type="module" src="/src/index.tsx"></script>
</head>
<body>
<div id="appRoot" style="min-height: 48.5px"></div>
<noscript>You need to enable JavaScript to run this app.</noscript>
</body>
</html>
