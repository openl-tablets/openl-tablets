### AWS S3 Repository
# Repository factory ID for org.openl.rules.repository.aws.S3RepositoryFactory
repo-aws-s3.factory = repo-aws-s3
# Non-standard service endpoint. If this value is left empty, Amazon AWS endpoint is used.
repo-aws-s3.service-endpoint =
# A logical unit of storage in the AWS object storage service. The value is globally unique.
repo-aws-s3.bucket-name =
# AWS region that is geographically the closest one to a user to optimize latency, minimize costs and so on.
repo-aws-s3.region-name =
# Alphanumeric text string that identifies the account owner.
repo-aws-s3.access-key =
# Password for a given access key.
repo-aws-s3.secret-key =
# Repository changes check interval in seconds. The value must be greater than 0.
repo-aws-s3.listener-timer-period = 10
# Server-side encryption algorithm that is requested for every object written to the bucket.
# If this value is left empty, the default encryption of the bucket is used.
# Available algorithms:
# "AES256" - encryption with Amazon S3 managed keys (SSE-S3).
# "aws:kms" - encryption with AWS Key Management Service keys (SSE-KMS).
# "aws:kms:dsse" - dual-layer encryption with AWS Key Management Service keys (DSSE-KMS).
# "aws:fsx" and "aws:backup" - algorithms of other AWS services that S3 API accepts. The value is sent as is.
repo-aws-s3.sse-algorithm =
# ID, ARN or alias of the AWS KMS key that encrypts the objects.
# It is used with the "aws:kms" and "aws:kms:dsse" algorithms only.
# If the key belongs to another AWS account, the full ARN is required.
# If this value is left empty, the AWS managed key "aws/s3" is used.
repo-aws-s3.sse-kms-key-id =
