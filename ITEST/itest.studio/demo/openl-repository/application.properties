# Boots the server the way the DEMO package does: DemoInit creates the demo projects on start-up
# and deploys "Example 3 - Auto Policy Calculation" as a web service. See EPBDS-16409.
#
# demo.init is deliberately absent here. WebStudioTest seeds it into the settings file of openl.home, the
# way the DEMO start script does, so that the demo initialization clears the property from a file that
# exists and the start-up meets the settings write the DEMO package meets. See EPBDS-16473.

db.url = jdbc:h2:mem:demo-users-db;DB_CLOSE_DELAY=-1

production-repository-configs = deployment
repository.deployment.name = Deployment
repository.deployment.$ref = repo-file
repository.deployment.uri = ${openl.home}/repositories/deployment
repository.deployment.base.path =
