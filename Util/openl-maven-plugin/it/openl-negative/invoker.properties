# Every module of this reactor is expected to fail on its own. --fail-at-end lets all of them
# run; verify.groovy checks the reactor summary and the per-module output.
invoker.goals = clean verify --fail-at-end
invoker.buildResult = failure
openl.perf.mavenOpts = ${jacoco.argLine} -Xms16m -Xmx96m -XX:MaxMetaspaceSize=192m
openl.perf.timeoutPlus = 30
