invoker.goals = openl:migrate -Dopenl.migrate.scmConnection=scm:git:. verify
# _3_performance budgets a run from its file count, and one pom.xml plus one rules.xml lands on the 15
# second minimum. This fixture does the most work of the migrate suite though: eight migrators, a git
# commit for each, and an openl:verify that boots Jetty - around 45 seconds while the other integration
# tests run alongside it. Without the surcharge the budget and the run are equally long, so the test
# passes or times out by chance.
openl.perf.timeoutPlus = 20
