# Execute in the second order
invoker.ordinal = 500

# Download all necessary artifacts, including plugins
invoker.goals = dependency:resolve-plugins dependency:go-offline dependency:tree

# Resolves the dependencies of every project in one build, which is not a memory check: Maven 3.10 needs more heap
# than the 64 MB the other builds get to detect memory issues
invoker.mavenOpts = -Xms16m -Xmx256m -XX:MaxMetaspaceSize=192m
