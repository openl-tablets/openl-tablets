# Execute in the second order
invoker.ordinal = 500

# Download all necessary artifacts, including plugins. The version is pinned: Maven 3.8 takes 2.8 by default,
# which resolves the openl modules of the reactor before they are packaged and fails.
invoker.goals = org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve-plugins \
    org.apache.maven.plugins:maven-dependency-plugin:3.11.0:go-offline

# Resolves the dependencies of every project in one build, which is not a memory check: Maven 3.10 needs more heap
# than the 64 MB the other builds get to detect memory issues
invoker.mavenOpts = -Xms16m -Xmx256m -XX:MaxMetaspaceSize=192m
